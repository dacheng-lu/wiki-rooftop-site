<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声音对比 — Play</title>
<style>
:root{--bg:#0b1022;--card:#141a30;--line:#26304d;--text:#eef2ff;--muted:#9fb0cc;--gold:#d4af37;--ok:#3fb27f;--warn:#c26b3a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1022;color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 20px 80px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-size:25px}
.sub{color:var(--muted);font-size:14px;margin:8px 0 26px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{width:auto;padding:8px 14px;font-size:13px}
.list{display:flex;flex-direction:column;gap:14px}
article{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.model{font-weight:650}
.meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.text{color:#dbe4f7;font-size:14px;margin:8px 0 10px}
audio{width:100%;height:34px;filter:invert(0.92) hue-rotate(180deg)}
.score{display:flex;flex-direction:column;gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row span{font-size:12px;color:var(--muted);min-width:72px}
.btns{display:flex;gap:4px}
button{cursor:pointer;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#0f1526;color:var(--text);font-size:13px}
button[aria-pressed=true]{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.status{font-size:12px;color:var(--muted);min-height:16px}
.status.ok{color:var(--ok)} .status.err{color:var(--warn)}
.avg{font-size:12px;color:var(--ok)}
footer{margin-top:26px;color:var(--muted);font-size:13px}
a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <header><h1>声音对比 · S.J.</h1><a href="../">← 每日图文</a></header>
  <p class="sub">声源代号 <b>S.J.</b>。同一段参考录音，五个本地模型分别生成中文与英文样本；另有两条降调路线（后期变调 / 先把参考音压低再合成）。点分数即刻记录 —— 像不像、自然度、干净度各 1–5。</p>
  <div class="filters" id="filters" role="group" aria-label="音高筛选">
    <button type="button" data-filter="all" aria-pressed="true">全部</button>
    <button type="button" data-filter="zh" aria-pressed="false">中文</button>
    <button type="button" data-filter="en" aria-pressed="false">English</button>
    <button type="button" data-filter="ref" aria-pressed="false">参考音降调</button>
  </div>
  <div class="list" id="list"></div>
  <footer id="foot">加载中…</footer>
</main>
<script src="voice.js"></script>
</body>
</html>
